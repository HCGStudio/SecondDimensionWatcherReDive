<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c96442"/>
      <stop offset="100%" stop-color="#a84e32"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f4ed"/>
      <stop offset="100%" stop-color="#e8e6dc"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Outer eye/lens ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#lens)" stroke-width="28" opacity="0.9"/>
  <!-- Inner circle (iris) -->
  <circle cx="256" cy="256" r="100" fill="url(#lens)" opacity="0.15"/>
  <!-- Pupil / observer dot -->
  <circle cx="256" cy="256" r="48" fill="url(#lens)" opacity="0.9"/>
  <!-- Play triangle inside pupil -->
  <polygon points="244,232 244,280 280,256" fill="url(#bg)"/>
  <!-- Crosshair lines -->
  <line x1="256" y1="72" x2="256" y2="136" stroke="url(#lens)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="376" x2="256" y2="440" stroke="url(#lens)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="72" y1="256" x2="136" y2="256" stroke="url(#lens)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="376" y1="256" x2="440" y2="256" stroke="url(#lens)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>
