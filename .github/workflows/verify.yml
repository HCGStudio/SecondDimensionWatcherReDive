name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SecondDimensionWatcherReDive.slnx

      - name: Build
        run: dotnet build SecondDimensionWatcherReDive.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test SecondDimensionWatcherReDive.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecondDimensionWatcherReDive.Client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Type check
        run: yarn typecheck

      - name: Check formatting
        run: yarn format:check

      - name: Build
        run: yarn build

  container:
    name: Container smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build final container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          tags: sdw-redive:verify
          build-args: VERSION=0.0.0-ci.${{ github.run_id }}

      - name: Run migrations, health check, and homepage smoke test
        shell: bash
        run: |
          set -Eeuo pipefail

          network="sdw-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database="sdw-verify-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          application="sdw-verify-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$database" 2>&1 || true
              docker logs "$application" 2>&1 || true
            fi
            docker rm -f "$application" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run --detach \
            --name "$database" \
            --network "$network" \
            --network-alias postgres \
            --env POSTGRES_USER=sdw \
            --env POSTGRES_PASSWORD=sdw_ci_password \
            --env POSTGRES_DB=sdw \
            postgres:16-alpine

          for attempt in {1..30}; do
            if docker exec "$database" pg_isready --username sdw --dbname sdw; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          docker run --detach \
            --name "$application" \
            --network "$network" \
            --publish 127.0.0.1:5097:8080 \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env ConnectionStrings__sdw='Host=postgres;Username=sdw;Password=sdw_ci_password;Database=sdw' \
            --env JwtSecret='ci-only-secret-at-least-32-characters' \
            --env PasswordFile=/tmp/password.json \
            --env DataProtection__KeyRingPath=/tmp/data-protection-keys \
            --env FileStore__Local=/tmp/downloads \
            --env DisableCors=true \
            sdw-redive:verify

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5097/ > homepage.html; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$application" | grep --quiet true; then
              echo "Application container exited before becoming healthy" >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Application did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done

          migration_count=$(docker exec "$database" \
            psql --username sdw --dbname sdw --tuples-only --no-align \
            --command 'SELECT COUNT(*) FROM "__EFMigrationsHistory";')
          test "$migration_count" -gt 0
          grep --fixed-strings --quiet '<div id=app></div>' homepage.html

  quality_gate:
    name: Quality gate
    if: always()
    needs: [backend, frontend, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTAINER_RESULT" = success
