name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SecondDimensionWatcherReDive.slnx

      - name: Build
        run: dotnet build SecondDimensionWatcherReDive.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test SecondDimensionWatcherReDive.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecondDimensionWatcherReDive.Client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Type check
        run: yarn typecheck

      - name: Check formatting
        run: yarn format:check

      - name: Build
        run: yarn build

  container:
    name: Container (${{ matrix.arch }})
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            smoke: true
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            smoke: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build final container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          load: ${{ matrix.smoke }}
          push: false
          tags: sdw-redive:verify-${{ matrix.arch }}
          build-args: VERSION=0.0.0-ci.${{ github.run_id }}
          cache-from: type=gha,scope=verify-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=verify-container-${{ matrix.arch }},ignore-error=true

      - name: Run migrations, health check, and homepage smoke test
        if: matrix.smoke
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
          VERIFY_IMAGE: sdw-redive:verify-${{ matrix.arch }}
        run: >-
          bash .github/scripts/container-runtime-smoke.sh
          "$VERIFY_IMAGE" "$EXPECTED_ARCHITECTURE"

  quality_gate:
    name: Quality gate
    if: always()
    needs: [backend, frontend, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTAINER_RESULT" = success
