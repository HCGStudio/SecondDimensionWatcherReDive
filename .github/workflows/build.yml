name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (leave empty for pre-release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        run: >-
          dotnet test SecondDimensionWatcherReDive.slnx -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Enforce gradual coverage floor
        shell: bash
        run: |
          mapfile -t coverage_files < <(find . -path '*/TestResults/*/coverage.cobertura.xml' -print)
          node deployments/ci/check-dotnet-coverage.mjs 0.15 "${coverage_files[@]}" \
            | tee coverage-summary.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
            coverage-summary.txt

  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Build Frontend
        working-directory: SecondDimensionWatcherReDive.Client
        run: |
          yarn install --immutable
          yarn test:unit
          yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive.Client/dist/

  frontend-e2e:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: SecondDimensionWatcherReDive.Client
        run: yarn install --immutable

      - name: Install Chromium
        working-directory: SecondDimensionWatcherReDive.Client
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright journeys
        working-directory: SecondDimensionWatcherReDive.Client
        run: yarn test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          if-no-files-found: ignore
          path: |
            SecondDimensionWatcherReDive.Client/playwright-report/
            SecondDimensionWatcherReDive.Client/test-results/playwright/

  fuse-mount-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install FUSE and NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev clang zlib1g-dev

      - name: Publish NativeAOT smoke binary
        run: >-
          dotnet publish SecondDimensionWatcherReDive.FUSE/SecondDimensionWatcherReDive.FUSE.csproj
          -c Release -r linux-x64 -p:StripSymbols=true
          -o publish-fuse-smoke

      - name: Run real mount when supported
        run: deployments/ci/fuse-mount-smoke.sh publish-fuse-smoke/sdwfuse

  delivery-smoke:
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Set package metadata
        run: |
          echo "VERSION=0.0.0-ci.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE=1" >> "$GITHUB_ENV"
          echo "ARCH=amd64" >> "$GITHUB_ENV"

      - name: Publish package payload
        run: >-
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj
          -c Release -r linux-x64 --self-contained false
          /p:Version=${VERSION} -o publish

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build Debian package and final container
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "dist/sdw-redive_${VERSION}_${ARCH}.deb"
          docker build --tag sdw-redive:delivery-smoke .

      - name: Install, migrate, start, and uninstall delivery artifacts
        run: >-
          deployments/ci/delivery-smoke.sh sdw-redive:delivery-smoke
          "dist/sdw-redive_${VERSION}_${ARCH}.deb"

  build-linux-packages:
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r linux-${{ matrix.arch }} \
            --self-contained false \
            /p:Version=${VERSION} \
            -o publish

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Set package architecture
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "ARCH=amd64" >> "$GITHUB_ENV"
          else
            echo "ARCH=aarch64" >> "$GITHUB_ENV"
          fi

      - name: Build packages
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/sdw-redive_${VERSION}_${ARCH}.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/sdw-redive-${VERSION}.${ARCH}.rpm"
          nfpm package --config packaging/nfpm.yaml --packager archlinux --target "dist/sdw-redive-${VERSION}-${ARCH}.pkg.tar.zst"

      - name: Package as tar.gz
        run: |
          cp packaging/appsettings.yml publish/appsettings.yml
          cp packaging/sdw-redive.service publish/sdw-redive.service
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          tar -czf "dist/sdw-redive_${VERSION}_linux-${ARCH}.tar.gz" -C publish .

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*

  build-windows-zip:
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r win-${{ matrix.arch }} \
            --self-contained false \
            /p:Version=${VERSION} \
            -o publish

      - name: Package as zip
        run: |
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          cd publish
          zip -r "../sdw-redive_${VERSION}_win-${{ matrix.arch }}.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: packages-win-${{ matrix.arch }}
          path: sdw-redive_*.zip

  build-portable:
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            --self-contained false \
            -p:UseAppHost=false \
            /p:Version=${VERSION} \
            -o publish

      - name: Package as tar.gz
        run: |
          cp packaging/appsettings.yml publish/appsettings.yml
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          mkdir -p dist
          tar -czf "dist/sdw-redive_${VERSION}_portable.tar.gz" -C publish .

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: packages-portable
          path: dist/*

  build-fuse:
    if: github.event_name != 'pull_request'
    # NativeAOT cross-compile is not supported, so each architecture builds on a
    # native runner. ubuntu-24.04-arm is GA for public repos; private repos pay
    # for arm minutes — switch to a self-hosted arm runner if that becomes an
    # issue. The job depends on `test` only (no frontend artifact needed).
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            pkg-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            pkg-arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites
        # clang + zlib are needed by the AOT linker; libfuse3-dev gives us the
        # `libfuse3.so` symlink the linker resolves `-lfuse3` against (only the
        # runtime .so.3 ships in libfuse3-3).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libfuse3-dev binutils

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ARCH=${{ matrix.pkg-arch }}" >> "$GITHUB_ENV"

      - name: Publish sdwfuse (NativeAOT)
        run: |
          dotnet publish SecondDimensionWatcherReDive.FUSE/SecondDimensionWatcherReDive.FUSE.csproj \
            -c Release \
            -r linux-${{ matrix.arch }} \
            -p:StripSymbols=true \
            /p:Version=${VERSION} \
            -o publish-fuse
          ls -lh publish-fuse/sdwfuse
          file publish-fuse/sdwfuse

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build distro packages
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm-fuse.yaml --packager deb       --target "dist/sdwfuse_${VERSION}_${ARCH}.deb"
          nfpm package --config packaging/nfpm-fuse.yaml --packager rpm       --target "dist/sdwfuse-${VERSION}.${ARCH}.rpm"
          nfpm package --config packaging/nfpm-fuse.yaml --packager archlinux --target "dist/sdwfuse-${VERSION}-${ARCH}.pkg.tar.zst"

      - name: Package as tar.gz
        run: |
          mkdir -p dist
          cp SecondDimensionWatcherReDive.FUSE/README.md publish-fuse/README.md
          cp LICENSE publish-fuse/LICENSE
          cp SecondDimensionWatcherReDive.FUSE/THIRD_PARTY_NOTICES.md publish-fuse/THIRD_PARTY_NOTICES.md
          tar -czf "dist/sdwfuse_${VERSION}_linux-${{ matrix.arch }}.tar.gz" \
            -C publish-fuse sdwfuse README.md LICENSE THIRD_PARTY_NOTICES.md

      - name: Upload sdwfuse packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-fuse-linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: github.event_name != 'pull_request'
    needs:
      - build-linux-packages
      - build-windows-zip
      - build-portable
      - build-fuse
      - frontend-e2e
      - fuse-mount-smoke
      - delivery-smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release/
          merge-multiple: true

      - name: Create Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          files: release/*
          generate_release_notes: true

      - name: Create Pre-release
        if: env.IS_RELEASE == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pre-${{ env.VERSION }}
          name: Pre-release ${{ env.VERSION }}
          prerelease: true
          files: release/*
          generate_release_notes: true
