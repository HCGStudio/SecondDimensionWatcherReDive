name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in every package and container
        required: true
        type: string
      commit_sha:
        description: Fully verified commit to build
        required: true
        type: string
      image_repository:
        description: Lowercase GHCR image repository without a tag
        required: true
        type: string
    outputs:
      image_digest:
        description: Immutable digest of the multi-architecture image
        value: ${{ jobs.container.outputs.digest }}
      bundle_name:
        description: Artifact containing all checked release files
        value: ${{ jobs.validate_artifacts.outputs.bundle_name }}

permissions:
  contents: read

jobs:
  validate_inputs:
    name: Validate build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Require an exact commit, safe version, and GHCR target
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

  frontend:
    name: Build frontend once
    needs: validate_inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Build frontend
        working-directory: SecondDimensionWatcherReDive.Client
        run: |
          yarn install --immutable
          yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive.Client/dist/
          if-no-files-found: error
          retention-days: 14

  linux_packages:
    name: Linux app packages (${{ matrix.arch }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            package_arch: amd64
          - arch: arm64
            package_arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Publish backend
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r linux-${{ matrix.arch }} \
            --self-contained false \
            /p:Version="$VERSION" \
            -o publish

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build Linux packages
        env:
          ARCH: ${{ matrix.package_arch }}
          RELEASE: ${{ github.run_number }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/sdw-redive_${VERSION}_${ARCH}.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/sdw-redive-${VERSION}.${ARCH}.rpm"
          nfpm package --config packaging/nfpm.yaml --packager archlinux --target "dist/sdw-redive-${VERSION}-${ARCH}.pkg.tar.zst"
          cp packaging/appsettings.yml publish/appsettings.yml
          cp packaging/sdw-redive.service publish/sdw-redive.service
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          tar -czf "dist/sdw-redive_${VERSION}_linux-${ARCH}.tar.gz" -C publish .

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows_packages:
    name: Windows package (${{ matrix.arch }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Publish backend
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r win-${{ matrix.arch }} \
            --self-contained false \
            /p:Version="$VERSION" \
            -o publish

      - name: Package as zip
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          (cd publish && zip -r "../sdw-redive_${VERSION}_win-${{ matrix.arch }}.zip" .)

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: packages-win-${{ matrix.arch }}
          path: sdw-redive_*.zip
          if-no-files-found: error
          retention-days: 14

  portable_package:
    name: Portable package
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Publish backend
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            --self-contained false \
            -p:UseAppHost=false \
            /p:Version="$VERSION" \
            -o publish

      - name: Package portable build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp packaging/appsettings.yml publish/appsettings.yml
          cp LICENSE publish/LICENSE
          cp THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md
          mkdir -p dist
          tar -czf "dist/sdw-redive_${VERSION}_portable.tar.gz" -C publish .

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: packages-portable
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  fuse_packages:
    name: FUSE packages (${{ matrix.arch }})
    needs: validate_inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            package_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            package_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libfuse3-dev binutils

      - name: Publish sdwfuse (NativeAOT)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish SecondDimensionWatcherReDive.FUSE/SecondDimensionWatcherReDive.FUSE.csproj \
            -c Release \
            -r linux-${{ matrix.arch }} \
            -p:StripSymbols=true \
            /p:Version="$VERSION" \
            -o publish-fuse
          file publish-fuse/sdwfuse

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build FUSE packages
        env:
          ARCH: ${{ matrix.package_arch }}
          RELEASE: ${{ github.run_number }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm-fuse.yaml --packager deb --target "dist/sdwfuse_${VERSION}_${ARCH}.deb"
          nfpm package --config packaging/nfpm-fuse.yaml --packager rpm --target "dist/sdwfuse-${VERSION}.${ARCH}.rpm"
          nfpm package --config packaging/nfpm-fuse.yaml --packager archlinux --target "dist/sdwfuse-${VERSION}-${ARCH}.pkg.tar.zst"
          cp SecondDimensionWatcherReDive.FUSE/README.md publish-fuse/README.md
          cp LICENSE publish-fuse/LICENSE
          cp SecondDimensionWatcherReDive.FUSE/THIRD_PARTY_NOTICES.md publish-fuse/THIRD_PARTY_NOTICES.md
          tar -czf "dist/sdwfuse_${VERSION}_linux-${{ matrix.arch }}.tar.gz" \
            -C publish-fuse sdwfuse README.md LICENSE THIRD_PARTY_NOTICES.md

      - name: Upload FUSE packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-fuse-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container:
    name: Multi-architecture container
    needs: validate_inputs
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.image_repository }}:candidate-${{ inputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.commit_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: mode=max
          sbom: true

  validate_artifacts:
    name: Validate complete artifact set
    needs:
      - linux_packages
      - windows_packages
      - portable_package
      - fuse_packages
      - container
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      bundle_name: release-bundle-${{ inputs.commit_sha }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release/
          merge-multiple: true

      - name: Require every target package and generate checksums
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release

          expected=(
            "sdw-redive_${VERSION}_amd64.deb"
            "sdw-redive-${VERSION}.amd64.rpm"
            "sdw-redive-${VERSION}-amd64.pkg.tar.zst"
            "sdw-redive_${VERSION}_linux-amd64.tar.gz"
            "sdw-redive_${VERSION}_aarch64.deb"
            "sdw-redive-${VERSION}.aarch64.rpm"
            "sdw-redive-${VERSION}-aarch64.pkg.tar.zst"
            "sdw-redive_${VERSION}_linux-aarch64.tar.gz"
            "sdw-redive_${VERSION}_win-x64.zip"
            "sdw-redive_${VERSION}_win-arm64.zip"
            "sdw-redive_${VERSION}_portable.tar.gz"
            "sdwfuse_${VERSION}_amd64.deb"
            "sdwfuse-${VERSION}.amd64.rpm"
            "sdwfuse-${VERSION}-amd64.pkg.tar.zst"
            "sdwfuse_${VERSION}_linux-x64.tar.gz"
            "sdwfuse_${VERSION}_aarch64.deb"
            "sdwfuse-${VERSION}.aarch64.rpm"
            "sdwfuse-${VERSION}-aarch64.pkg.tar.zst"
            "sdwfuse_${VERSION}_linux-arm64.tar.gz"
          )

          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify image digest and target architectures
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$IMAGE_DIGEST" > image-manifest.txt
          grep --fixed-strings --quiet "linux/amd64" image-manifest.txt
          grep --fixed-strings --quiet "linux/arm64" image-manifest.txt

      - name: Upload checked release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ inputs.commit_sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
