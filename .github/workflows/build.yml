name: Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (leave empty for pre-release)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Build Frontend
        working-directory: SecondDimensionWatcherReDive.Client
        run: |
          yarn install --immutable
          yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive.Client/dist/

  build-linux-packages:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r linux-${{ matrix.arch }} \
            --self-contained false \
            /p:Version=${VERSION} \
            -o publish

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Set package architecture
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "ARCH=amd64" >> "$GITHUB_ENV"
          else
            echo "ARCH=arm64" >> "$GITHUB_ENV"
          fi

      - name: Build packages
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/sdw-redive_${VERSION}_${ARCH}.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/sdw-redive-${VERSION}.${ARCH}.rpm"
          nfpm package --config packaging/nfpm.yaml --packager archlinux --target "dist/sdw-redive-${VERSION}-${ARCH}.pkg.tar.zst"

      - name: Package as tar.gz
        run: |
          cp packaging/appsettings.yml publish/appsettings.yml
          cp packaging/sdw-redive.service publish/sdw-redive.service
          tar -czf "dist/sdw-redive_${VERSION}_linux-${{ matrix.arch }}.tar.gz" -C publish .

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*

  build-windows-zip:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            -r win-${{ matrix.arch }} \
            --self-contained false \
            /p:Version=${VERSION} \
            -o publish

      - name: Package as zip
        run: |
          cd publish
          zip -r "../sdw-redive_${VERSION}_win-${{ matrix.arch }}.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: packages-win-${{ matrix.arch }}
          path: sdw-redive_*.zip

  build-freebsd-pkg:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            pkg_arch: amd64
          - arch: arm64
            pkg_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            --self-contained false \
            -p:UseAppHost=false \
            /p:Version=${VERSION} \
            -o publish

      - name: Stage FreeBSD package layout
        run: |
          mkdir -p staging/usr/local/lib/sdw-redive
          mkdir -p staging/usr/local/etc/sdw-redive
          mkdir -p staging/usr/local/etc/rc.d

          cp -r publish/* staging/usr/local/lib/sdw-redive/
          cp packaging/appsettings.yml staging/usr/local/etc/sdw-redive/appsettings.yml
          cp packaging/rc.d/sdw_redive staging/usr/local/etc/rc.d/sdw_redive
          chmod 755 staging/usr/local/etc/rc.d/sdw_redive

      - name: Build FreeBSD pkg
        run: |
          mkdir -p dist
          bash packaging/freebsd/build-pkg.sh \
            staging \
            "dist/sdw-redive-${VERSION}-FreeBSD-15-RELEASE-${{ matrix.pkg_arch }}.pkg" \
            "$VERSION" \
            "${{ matrix.pkg_arch }}"

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: packages-freebsd-${{ matrix.arch }}
          path: dist/*.pkg

  build-portable:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: SecondDimensionWatcherReDive/wwwroot/

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish Backend
        run: |
          dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
            -c Release \
            --self-contained false \
            -p:UseAppHost=false \
            /p:Version=${VERSION} \
            -o publish

      - name: Package as tar.gz
        run: |
          cp packaging/appsettings.yml publish/appsettings.yml
          mkdir -p dist
          tar -czf "dist/sdw-redive_${VERSION}_portable.tar.gz" -C publish .

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: packages-portable
          path: dist/*

  release:
    needs: [build-linux-packages, build-windows-zip, build-freebsd-pkg, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release/
          merge-multiple: true

      - name: Create Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          files: release/*
          generate_release_notes: true

      - name: Create Pre-release
        if: env.IS_RELEASE == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ env.VERSION }}
          name: Pre-release ${{ env.VERSION }}
          prerelease: true
          files: release/*
          generate_release_notes: true
