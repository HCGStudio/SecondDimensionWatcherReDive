name: Container Build & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (leave empty for pre-release)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name and version
        run: |
          REGISTRY="ghcr.io"
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          IMAGE_NAME=$(echo "${{ github.repository_owner }}/sdw-redive" | tr '[:upper:]' '[:lower:]')

          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
            TAG1="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            TAG2="${REGISTRY}/${IMAGE_NAME}:latest"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            TAG1="${REGISTRY}/${IMAGE_NAME}:pre-${VERSION}"
            TAG2="${REGISTRY}/${IMAGE_NAME}:prerelease-latest"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "TAG1=${TAG1}" >> "$GITHUB_ENV"
          echo "TAG2=${TAG2}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.TAG1 }}
            ${{ env.TAG2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
