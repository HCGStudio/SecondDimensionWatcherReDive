name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false
  queue: max

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      image_repository: ${{ steps.metadata.outputs.image_repository }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate source, version, and release namespace
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep --fixed-strings --quiet "<AssemblyVersion>${version}</AssemblyVersion>" \
            SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj
          grep --fixed-strings --quiet "<FileVersion>${version}</FileVersion>" \
            SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj

          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          image_repository="ghcr.io/$(printf '%s/sdw-redive' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "commit_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: metadata
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    name: Build checked release artifacts
    needs: [metadata, verify]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      commit_sha: ${{ needs.metadata.outputs.commit_sha }}
      image_repository: ${{ needs.metadata.outputs.image_repository }}
      version: ${{ needs.metadata.outputs.version }}

  publish_version:
    name: Publish immutable stable release
    needs: [metadata, build]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit_sha }}

      - name: Ensure the default branch still identifies this release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          current_sha=$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$current_sha" = "$SOURCE_SHA"
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"

      - name: Download checked release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: release/

      - name: Verify package checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable image and verified release
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REPOSITORY: ${{ needs.metadata.outputs.image_repository }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          inspect_image() {
            local attempt
            local output
            for attempt in 1 2 3 4; do
              if output=$(docker buildx imagetools inspect "$@"); then
                printf '%s' "$output"
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to inspect the image after $attempt attempts" >&2
                return 1
              fi
              echo "::warning::Image inspection attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
            done
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_tag="v${VERSION}"
          registry_tag="$VERSION"
          image_tag="${IMAGE_REPOSITORY}:${VERSION}"
          if ! release_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/release-status.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag"); then
            echo "Could not determine whether Release $release_tag exists" >&2
            exit 1
          fi
          case "$release_status" in
            200)
              echo "Release $release_tag already exists; refusing to overwrite it" >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "GitHub returned HTTP $release_status while checking Release $release_tag" >&2
              exit 1
              ;;
          esac

          if ! ref_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/ref-status.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag"); then
            echo "Could not determine whether tag $release_tag exists" >&2
            exit 1
          fi
          case "$ref_status" in
            200)
              echo "Tag $release_tag already exists; refusing to reuse it" >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "GitHub returned HTTP $ref_status while checking tag $release_tag" >&2
              exit 1
              ;;
          esac

          current_sha=$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "$DEFAULT_BRANCH moved during the release build" >&2
            exit 1
          fi

          manifest=$(inspect_image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --raw)
          resolved_digest="sha256:$(printf '%s' "$manifest" | sha256sum | cut -d ' ' -f1)"
          if [ "$resolved_digest" != "$IMAGE_DIGEST" ]; then
            echo "Resolved digest $resolved_digest differs from $IMAGE_DIGEST" >&2
            exit 1
          fi
          if ! jq -e -f .github/scripts/validate-container-index.jq \
            <<< "$manifest" >/dev/null; then
            echo "Candidate is not a strict amd64/arm64 OCI index with matching attestations" >&2
            exit 1
          fi

          prospective_manifest=$(docker buildx imagetools create --dry-run "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}")
          if [ "$prospective_manifest" != "$manifest" ]; then
            echo "Immutable tag dry-run differs from the validated manifest" >&2
            exit 1
          fi

          validate_image_identity() {
            local digest="$1"
            local image_configs
            image_configs=$(inspect_image \
              "${IMAGE_REPOSITORY}@${digest}" --format '{{json .Image}}')
            jq -e --arg source "$SOURCE_SHA" --arg version "$VERSION" '
              type == "object" and
              ([keys[]] | sort) == ["linux/amd64", "linux/arm64"] and
              .["linux/amd64"].architecture == "amd64" and
              .["linux/amd64"].os == "linux" and
              .["linux/arm64"].architecture == "arm64" and
              .["linux/arm64"].os == "linux" and
              all(.[];
                .config.Labels["org.opencontainers.image.revision"] == $source and
                .config.Labels["org.opencontainers.image.version"] == $version)
            ' <<< "$image_configs" >/dev/null
          }

          if ! validate_image_identity "$IMAGE_DIGEST"; then
            echo "Candidate configs do not match source $SOURCE_SHA and version $VERSION" >&2
            exit 1
          fi

          registry_repository="${IMAGE_REPOSITORY#ghcr.io/}"
          if [ "$registry_repository" = "$IMAGE_REPOSITORY" ]; then
            echo "Unexpected image repository: $IMAGE_REPOSITORY" >&2
            exit 1
          fi
          registry_token_response=$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GH_TOKEN}" \
            --get 'https://ghcr.io/token' \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${registry_repository}:pull,push")
          registry_token=$(jq -er '.token // .access_token' <<< "$registry_token_response")

          get_registry_manifest() {
            local headers_path="$1"
            local body_path="$2"
            local status
            if ! status=$(curl --silent --show-error \
              --dump-header "$headers_path" \
              --output "$body_path" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${registry_repository}/manifests/${registry_tag}"); then
              echo "Could not query $image_tag" >&2
              return 1
            fi
            printf '%s' "$status"
          }

          validate_registry_manifest() {
            local headers_path="$1"
            local body_path="$2"
            local body_digest
            local header_digest
            header_digest=$(tr -d '\r' < "$headers_path" | \
              awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tail -n 1)
            body_digest="sha256:$(sha256sum "$body_path" | cut -d ' ' -f1)"
            if [[ ! "$header_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || \
               [ "$header_digest" != "$body_digest" ]; then
              echo "$image_tag returned an invalid Docker-Content-Digest" >&2
              return 1
            fi
            if ! jq -e -f .github/scripts/validate-container-index.jq \
              "$body_path" >/dev/null; then
              echo "$image_tag is not a strict amd64/arm64 OCI index with matching attestations" >&2
              return 1
            fi
            if ! validate_image_identity "$body_digest"; then
              echo "$image_tag cannot be proven to match source $SOURCE_SHA and version $VERSION" >&2
              return 1
            fi
            printf '%s' "$body_digest"
          }

          preflight_status=$(get_registry_manifest \
            "$RUNNER_TEMP/preflight-version-headers" \
            "$RUNNER_TEMP/preflight-version-manifest.json")
          case "$preflight_status" in
            200)
              validate_registry_manifest \
                "$RUNNER_TEMP/preflight-version-headers" \
                "$RUNNER_TEMP/preflight-version-manifest.json" >/dev/null
              ;;
            404) ;;
            *)
              echo "GHCR returned HTTP $preflight_status while checking $image_tag" >&2
              exit 1
              ;;
          esac

          require_release_source() {
            local current_source
            current_source=$(git ls-remote --exit-code --heads \
              origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
            if [[ ! "$current_source" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$current_source" != "$SOURCE_SHA" ] || \
               [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]; then
              echo "$DEFAULT_BRANCH no longer identifies source $SOURCE_SHA and version $VERSION" >&2
              return 1
            fi
          }

          created_ref=false
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$created_ref" = true ]; then
              gh release delete "$release_tag" --yes >/dev/null 2>&1 || true
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null || true)
              if [ "$current_sha" = "$SOURCE_SHA" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$release_tag" >/dev/null || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          require_release_source
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/$release_tag" \
            --field sha="$SOURCE_SHA" >/dev/null; then
            echo "Could not atomically create $release_tag; another ref may have won the race" >&2
            exit 1
          fi
          created_ref=true
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag" --jq '.object.sha')
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "Created tag $release_tag does not point to $SOURCE_SHA" >&2
            exit 1
          fi

          locked_status=$(get_registry_manifest \
            "$RUNNER_TEMP/locked-version-headers" \
            "$RUNNER_TEMP/locked-version-manifest.json")
          case "$locked_status" in
            200)
              IMAGE_DIGEST=$(validate_registry_manifest \
                "$RUNNER_TEMP/locked-version-headers" \
                "$RUNNER_TEMP/locked-version-manifest.json")
              manifest=$(< "$RUNNER_TEMP/locked-version-manifest.json")
              echo "::notice::Reusing verified immutable image $image_tag at $IMAGE_DIGEST"
              ;;
            404)
              docker buildx imagetools create \
                --tag "$image_tag" \
                --metadata-file "$RUNNER_TEMP/version-metadata.json" \
                "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
              tagged_digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/version-metadata.json")
              if [ "$tagged_digest" != "$IMAGE_DIGEST" ]; then
                echo "$image_tag resolved to $tagged_digest instead of $IMAGE_DIGEST" >&2
                exit 1
              fi
              ;;
            *)
              echo "GHCR returned HTTP $locked_status while checking $image_tag" >&2
              exit 1
              ;;
          esac

          final_status=$(get_registry_manifest \
            "$RUNNER_TEMP/final-version-headers" \
            "$RUNNER_TEMP/final-version-manifest.json")
          if [ "$final_status" != 200 ]; then
            echo "GHCR returned HTTP $final_status after publishing $image_tag" >&2
            exit 1
          fi
          final_digest=$(validate_registry_manifest \
            "$RUNNER_TEMP/final-version-headers" \
            "$RUNNER_TEMP/final-version-manifest.json")
          tagged_manifest=$(< "$RUNNER_TEMP/final-version-manifest.json")
          if [ "$final_digest" != "$IMAGE_DIGEST" ] || \
             [ "$tagged_manifest" != "$manifest" ]; then
            echo "$image_tag does not resolve to the validated manifest" >&2
            exit 1
          fi

          require_release_source
          gh release create "$release_tag" release/* \
            --verify-tag \
            --title "Release ${VERSION}" \
            --generate-notes \
            --notes "Container: ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          published_tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag" --jq '.object.sha')
          if [ "$published_tag_sha" != "$SOURCE_SHA" ]; then
            echo "Published tag $release_tag no longer points to $SOURCE_SHA" >&2
            exit 1
          fi

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          trap - EXIT

  promote_moving:
    name: Promote latest
    needs: [metadata, publish_version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: container-moving-stable
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote moving tag from the published version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_DIGEST: ${{ needs.publish_version.outputs.image_digest }}
          IMAGE_REPOSITORY: ${{ needs.metadata.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.publish_version.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          inspect_image() {
            local attempt
            local output
            for attempt in 1 2 3 4; do
              if output=$(docker buildx imagetools inspect "$@"); then
                printf '%s' "$output"
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to inspect the image after $attempt attempts" >&2
                return 1
              fi
              echo "::warning::Image inspection attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
            done
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          current_sha=$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "::notice::Not updating latest because $DEFAULT_BRANCH moved from $SOURCE_SHA to $current_sha"
            exit 0
          fi
          current_version=$(tr -d '[:space:]' < VERSION)
          if [ "$current_version" != "$VERSION" ]; then
            echo "::notice::Not updating latest because current VERSION is $current_version, not $VERSION"
            exit 0
          fi

          manifest=$(inspect_image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --raw)
          version_manifest=$(inspect_image "$IMAGE_TAG" --raw)
          if [ "$version_manifest" != "$manifest" ]; then
            echo "$IMAGE_TAG no longer resolves to the published digest" >&2
            exit 1
          fi

          moving_tag="${IMAGE_REPOSITORY}:latest"
          docker buildx imagetools create --tag "$moving_tag" "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          moving_manifest=$(inspect_image "$moving_tag" --raw)
          if [ "$moving_manifest" != "$manifest" ]; then
            echo "$moving_tag does not resolve to the published manifest" >&2
            exit 1
          fi
          inspect_image "$moving_tag"
