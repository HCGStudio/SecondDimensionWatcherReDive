name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false
  queue: max

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      image_repository: ${{ steps.metadata.outputs.image_repository }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read release metadata
        id: metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          prerelease=false
          if [[ "$version" == *-rc* ]]; then
            prerelease=true
          fi

          image_repository="ghcr.io/$(printf '%s/sdw-redive' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "commit_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: metadata
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      commit_sha: ${{ needs.metadata.outputs.commit_sha }}
      image_repository: ${{ needs.metadata.outputs.image_repository }}
      version: ${{ needs.metadata.outputs.version }}

  publish_version:
    name: Publish release
    needs: [metadata, build]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish version image and release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REPOSITORY: ${{ needs.metadata.outputs.image_repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${VERSION}"
          image_tag="${IMAGE_REPOSITORY}:${VERSION}"

          created_ref=false
          created_release=false
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$created_ref" = true ]; then
              if [ "$created_release" = true ]; then
                gh release delete "$release_tag" --yes >/dev/null 2>&1 || true
              fi
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null || true)
              if [ "$current_sha" = "$SOURCE_SHA" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$release_tag" >/dev/null || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/$release_tag" \
            --field sha="$SOURCE_SHA" >/dev/null
          created_ref=true

          docker buildx imagetools create \
            --tag "$image_tag" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          release_notes="$RUNNER_TEMP/release-notes.md"
          if [ -f "docs/releases/${VERSION}.md" ]; then
            cp "docs/releases/${VERSION}.md" "$release_notes"
          else
            : > "$release_notes"
          fi
          printf '\n\nContainer: %s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$release_notes"
          release_args=(
            --verify-tag
            --draft
            --title "Release ${VERSION}"
            --generate-notes
            --notes-file "$release_notes"
          )
          publish_args=(--draft=false)
          if [ "$PRERELEASE" = true ]; then
            release_args+=(--prerelease)
            publish_args+=(--latest=false)
          fi
          gh release create "$release_tag" "${release_args[@]}"
          created_release=true
          gh release upload "$release_tag" release/*
          gh release edit "$release_tag" "${publish_args[@]}"

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          trap - EXIT

  promote_moving:
    name: Publish latest
    needs: [metadata, publish_version]
    if: needs.metadata.outputs.prerelease == 'false'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: container-moving-stable
      queue: max
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish latest from the release digest
        env:
          IMAGE_DIGEST: ${{ needs.publish_version.outputs.image_digest }}
          IMAGE_REPOSITORY: ${{ needs.metadata.outputs.image_repository }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:latest" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
