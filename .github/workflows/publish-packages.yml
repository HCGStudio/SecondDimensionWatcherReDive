name: Publish Container Packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v3.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish Backend Container
      run: |
        dotnet publish SecondDimensionWatcherReDive/SecondDimensionWatcherReDive.csproj \
          /t:PublishContainer \
          -p:ContainerImageTag=$(git rev-parse --short HEAD)
