# 二次元观测器 Re:Dive 配置文件
# 详细说明: https://github.com/mahoshojoHCG/SecondDimensionWatcherReDive/blob/main/docs/server-deployment.md

# PostgreSQL 连接字符串（必填）
ConnectionStrings:
  sdw: "Host=localhost;Username=sdw;Password=YOUR_PASSWORD;Database=sdw"

# JWT 签名密钥（首次安装时自动生成）
JwtSecret: "<Please fill this with a 32 length random string>"

# qBittorrent Web API 地址（必填）
# UserName / Password 留空表示 qBittorrent 未启用鉴权（或已通过白名单放行本机）
Torrent:
  Remote:
    Url: "http://localhost:8080"
    UserName: ""
    Password: ""

# 下载文件存储路径
FileStore:
  Local: /var/lib/sdw-redive/downloads

# 受控 JavaScript 插件。生产环境默认拒绝未签名包；公钥值为 PEM 编码 RSA 公钥。
PluginPlatform:
  RootPath: /var/lib/sdw-redive/plugins
  AllowUnsignedLocalPackages: false
  MaximumPackageBytes: 4194304
  MaximumExpandedBytes: 16777216
  MaximumPackageFiles: 128
  MaximumStagedPackages: 32
  MaximumStagedPackageBytes: 67108864
  InvocationTimeoutMilliseconds: 5000
  MaximumWorkerCpuMilliseconds: 4000
  MaximumWorkerMemoryMegabytes: 256
  MaximumConcurrentWorkers: 4
  MaximumConcurrentWorkersPerPlugin: 1
  MaximumResponseBytes: 2097152
  MaximumPluginDataBytes: 67108864
  MaximumPluginDataFiles: 1000
  MaximumPluginDataPathDepth: 8
  CircuitBreakerFailures: 3
  CircuitBreakerSeconds: 60
  PreviewLifetimeMinutes: 30
  TrustedPublisherPublicKeys: {}

# 现有媒体库扫描（目录在网页「设置」中添加，不会移动或删除原文件）
# 缺失条目先撤下虚拟映射，超过 MissingGracePeriod 后才清理数据库记录
MediaLibrary:
  AllowedRoots:
    - /var/lib/sdw-redive/media
  ScanInterval: "00:05:00"
  SettlingPeriod: "00:00:30"
  MissingGracePeriod: "1.00:00:00"

# 密码文件路径
PasswordFile: /var/lib/sdw-redive/password.json

# 前端保存的敏感配置使用 ASP.NET Data Protection 加密；此密钥环必须持久化
DataProtection:
  KeyRingPath: /var/lib/sdw-redive/data-protection-keys

# TMDB API 密钥（用于海报和元数据）
TmdbApiKey: ""

# RSS 订阅源 URL 数组
MikananiFeeds: []

# AI 推断与对话配置（可选）。这里是部署默认值，登录后可在网页「设置」中覆盖。
# Engine: BuiltIn 或 CodexAppServer；内置 Provider 支持 OpenAI / Anthropic。
AI:
  Engine: "BuiltIn"
  Provider: "OpenAI"
  OpenAI:
    BaseUrl: https://api.openai.com/v1
    ApiMode: Responses
    ApiKey: ""
    Model: gpt-4o-mini
    MaxTokens: 1024
  Anthropic:
    BaseUrl: https://api.anthropic.com
    ApiKey: ""
    Model: claude-sonnet-4-20250514
    MaxTokens: 1024
    ApiVersion: "2023-06-01"
  CodexAppServer:
    Endpoint: ""
    BearerToken: ""
    Model: ""
    PermissionProfile: ":read-only"
    TimeoutSeconds: 300

Inference:
  RateLimitDelayMs: 1000

# 异常收件箱检测阈值（TimeSpan 使用 hh:mm:ss）
Incidents:
  DownloadStalledAfter: "00:15:00"
  ReportThrottle: "00:05:00"
  ReconciliationInterval: "00:05:00"
  Disk:
    MinimumAvailableBytes: 5368709120 # 5 GiB
    MinimumAvailablePercent: 5

# NFSv4 只读导出（可选，默认关闭）
# 客户端示例: sudo mount -t nfs4 -o vers=4,nolock,port=2049 host:/ /mnt
# Linux 上 2049 为特权端口，容器中需显式发布或改为非特权端口
Nfs:
  Enabled: false
  Port: 2049
  BindAddress: "0.0.0.0"
  LeaseSeconds: 90
  MaxConnections: 32

# Valkey / Redis 分布式缓存（可选，留空则使用内存缓存）
# Valkey:
#   ConnectionString: "localhost:6379"
#   InstanceName: "sdw-redive:"
