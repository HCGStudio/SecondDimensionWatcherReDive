# 二次元观测器 Re:Dive 配置文件
# 详细说明: https://github.com/mahoshojoHCG/SecondDimensionWatcherReDive/blob/main/docs/server-deployment.md

# PostgreSQL 连接字符串（必填）
ConnectionStrings:
  sdw: "Host=localhost;Username=sdw;Password=YOUR_PASSWORD;Database=sdw"

# JWT 签名密钥（首次安装时自动生成）
JwtSecret: "<Please fill this with a 32 length random string>"

Authentication:
  Issuer: "SecondDimensionWatcherReDive"
  Audience: "SecondDimensionWatcherReDive.Client"
  AccessTokenMinutes: 10
  RefreshTokenDays: 30
  RefreshTokenReuseGraceSeconds: 3
  PlaybackLinkMinutes: 15

OutboundHttp:
  MaxRedirects: 3
  TotalTimeoutSeconds: 30
  ConnectTimeoutSeconds: 10
  HappyEyeballsDelayMilliseconds: 250
  FirstByteTimeoutSeconds: 15
  MaxConcurrentRequests: 4
  MaxFeedBytes: 4194304
  MaxTorrentBytes: 8388608
  MaxFeedItems: 1000
  AllowedPrivateHosts: []
  AllowedPrivateNetworks: []

RateLimit:
  AuthPermitLimit: 10
  BasicPermitLimit: 20
  BasicWindowSeconds: 60
  AiPermitLimit: 30

# Loopback reverse proxies are trusted by default. For a proxy on another host or
# container, add only its exact address or smallest network, never client networks.
ReverseProxy:
  ForwardLimit: 1
  KnownProxies: []
  KnownNetworks: []

# qBittorrent Web API 地址（必填）
# UserName / Password 留空表示 qBittorrent 未启用鉴权（或已通过白名单放行本机）
Torrent:
  Remote:
    Url: "http://localhost:8080"
    UserName: ""
    Password: ""

# 下载文件存储路径
FileStore:
  Local: /var/lib/sdw-redive/downloads

# 现有媒体库扫描（目录在网页「设置」中添加，不会移动或删除原文件）
# 缺失条目先撤下虚拟映射，超过 MissingGracePeriod 后才清理数据库记录
MediaLibrary:
  AllowedRoots:
    - /var/lib/sdw-redive/media
  ScanInterval: "00:05:00"
  SettlingPeriod: "00:00:30"
  MissingGracePeriod: "1.00:00:00"

# 密码文件路径
PasswordFile: /var/lib/sdw-redive/password.json

# 前端保存的敏感配置使用 ASP.NET Data Protection 加密；此密钥环必须持久化
DataProtection:
  KeyRingPath: /var/lib/sdw-redive/data-protection-keys

# TMDB API 密钥（用于海报和元数据）
TmdbApiKey: ""

# RSS 订阅源 URL 数组
MikananiFeeds: []

# AI 推断与对话配置（可选）。这里是部署默认值，登录后可在网页「设置」中覆盖。
# Engine: BuiltIn 或 CodexAppServer；内置 Provider 支持 OpenAI / Anthropic。
AI:
  Engine: "BuiltIn"
  Provider: "OpenAI"
  OpenAI:
    BaseUrl: https://api.openai.com/v1
    ApiMode: Responses
    ApiKey: ""
    Model: gpt-4o-mini
    MaxTokens: 1024
  Anthropic:
    BaseUrl: https://api.anthropic.com
    ApiKey: ""
    Model: claude-sonnet-4-20250514
    MaxTokens: 1024
    ApiVersion: "2023-06-01"
  CodexAppServer:
    Endpoint: ""
    BearerToken: ""
    Model: ""
    PermissionProfile: ":read-only"
    TimeoutSeconds: 300

Inference:
  RateLimitDelayMs: 1000

# 异常收件箱检测阈值（TimeSpan 使用 hh:mm:ss）
Incidents:
  DownloadStalledAfter: "00:15:00"
  ReportThrottle: "00:05:00"
  ReconciliationInterval: "00:05:00"
  Disk:
    MinimumAvailableBytes: 5368709120 # 5 GiB
    MinimumAvailablePercent: 5

# NFSv4 只读导出（可选，默认关闭）
# 客户端示例: sudo mount -t nfs4 -o vers=4,nolock,port=2049 host:/ /mnt
# Linux 上 2049 为特权端口，容器中需显式发布或改为非特权端口
Nfs:
  Enabled: false
  Port: 2049
  BindAddress: "127.0.0.1"
  LeaseSeconds: 90
  MaxConnections: 32
  IdleTimeoutSeconds: 120
  AllowAnonymous: false
  AllowedNetworks:
    - "127.0.0.0/8"
    - "::1/128"

# Valkey / Redis 分布式缓存（可选，留空则使用内存缓存）
# Valkey:
#   ConnectionString: "localhost:6379"
#   InstanceName: "sdw-redive:"
