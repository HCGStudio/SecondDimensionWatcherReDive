name: sdw-redive
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
release: "${RELEASE}"
maintainer: "mahoshojoHCG"
description: "SecondDimensionWatcher Re:Dive - Anime download management system"
vendor: "SecondDimensionWatcherReDive"
homepage: "https://github.com/mahoshojoHCG/SecondDimensionWatcherReDive"
license: "MIT"

depends:
  - aspnetcore-runtime-10.0

recommends:
  - valkey

overrides:
  archlinux:
    depends:
      - aspnet-runtime-10.0
    recommends:
      - valkey

contents:
  - src: ./publish/
    dst: /usr/lib/sdw-redive
    type: tree

  - src: ./packaging/sdw-redive.service
    dst: /usr/lib/systemd/system/sdw-redive.service

  - src: ./packaging/appsettings.yml
    dst: /etc/sdw-redive/appsettings.yml
    type: config|noreplace

  - src: ./deployments/migrate-config.sh
    dst: /usr/lib/sdw-redive/migrate-config.sh
    file_info:
      mode: 0755

  - dst: /etc/sdw-redive
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

  - dst: /var/lib/sdw-redive
    type: dir
    file_info:
      mode: 0755
      owner: sdw-redive
      group: sdw-redive

  - dst: /var/lib/sdw-redive/downloads
    type: dir
    file_info:
      mode: 0755
      owner: sdw-redive
      group: sdw-redive

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
