name: sdw-redive
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
release: "${RELEASE}"
maintainer: "mahoshojoHCG"
description: "SecondDimensionWatcher Re:Dive - Anime download management system"
vendor: "SecondDimensionWatcherReDive"
homepage: "https://github.com/mahoshojoHCG/SecondDimensionWatcherReDive"
license: "Apache-2.0"

depends:
  - aspnetcore-runtime-10.0
  - postgresql-client
  - curl

recommends:
  - valkey

overrides:
  rpm:
    depends:
      - aspnetcore-runtime-10.0
      - postgresql
      - curl
  archlinux:
    depends:
      - aspnet-runtime-10.0
      - postgresql
      - curl
    recommends:
      - valkey

contents:
  - src: ./publish/
    dst: /usr/lib/sdw-redive
    type: tree

  - src: ./packaging/sdw-redive.service
    dst: /usr/lib/systemd/system/sdw-redive.service

  - src: ./packaging/appsettings.yml
    dst: /etc/sdw-redive/appsettings.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: sdw-redive

  - src: ./deployments/migrate-config.sh
    dst: /usr/lib/sdw-redive/migrate-config.sh
    file_info:
      mode: 0755

  - src: ./deployments/sdw-backup
    dst: /usr/bin/sdw-backup
    file_info:
      mode: 0755

  - src: ./packaging/sdw-backup.service
    dst: /usr/lib/systemd/system/sdw-backup.service

  - src: ./packaging/sdw-backup.timer
    dst: /usr/lib/systemd/system/sdw-backup.timer

  - src: ./packaging/backup.env
    dst: /etc/sdw-redive/backup.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: sdw-redive

  - src: ./LICENSE
    dst: /usr/share/doc/sdw-redive/LICENSE

  - src: ./THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/sdw-redive/THIRD_PARTY_NOTICES.md

  - dst: /etc/sdw-redive
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

  - dst: /var/lib/sdw-redive
    type: dir
    file_info:
      mode: 0755
      owner: sdw-redive
      group: sdw-redive

  - dst: /var/lib/sdw-redive/downloads
    type: dir
    file_info:
      mode: 0755
      owner: sdw-redive
      group: sdw-redive

  - dst: /var/lib/sdw-redive/data-protection-keys
    type: dir
    file_info:
      mode: 0700
      owner: sdw-redive
      group: sdw-redive

  - dst: /var/lib/sdw-redive/backups
    type: dir
    file_info:
      mode: 0700
      owner: sdw-redive
      group: sdw-redive

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
