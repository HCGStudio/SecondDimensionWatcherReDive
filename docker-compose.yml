services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdw
      POSTGRES_PASSWORD: sdw_password
      POSTGRES_DB: sdw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: SecondDimensionWatcherReDive/Dockerfile
    ports:
      - "5097:8080"
    environment:
      ConnectionStrings__sdw: "Host=db;Username=sdw;Password=sdw_password;Database=sdw"
      JwtSecret: "CHANGE_ME_TO_A_32_CHAR_RANDOM_STRING"
      FileStore__Local: "/data/downloads"
      DisableCors: "true"
    volumes:
      - downloads:/data/downloads
    depends_on:
      - db

  frontend:
    build:
      context: SecondDimensionWatcherReDive.Client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      PORT: "80"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  downloads:
